# fly.toml app configuration file generated for torn-company-monitor on 2026-01-17T19:19:21+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'torn-company-monitor'
primary_region = 'sjc'

[build]

[env]
  CHECK_INTERVAL = '60'

[processes]
  app = 'node company-monitor-daemon.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
