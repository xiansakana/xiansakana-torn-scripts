services:
  - type: web
    name: oc-spawn-monitor
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node oc-monitor-daemon.js
    envVars:
      - key: TORN_API_KEY
        sync: false
      - key: EMAIL_ENABLED
        value: true
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CHECK_INTERVAL
        value: 60
      - key: FILTER_MIN_DIFFICULTY
        value: simple
      - key: FILTER_MIN_SCOPE
        value: 1
      - key: NODE_VERSION
        value: 18.17.0
