<div class="sell-price-tool-container">
  <div class="container">
    <h1>Torn 物品出售均价计算工具</h1>
    <div class="input-area">
      <div class="input-group">
        <label for="apiKey">API Key (full)</label>
        <input type="text" id="apiKey" placeholder="请输入你的Torn API Key" />
      </div>
      <div class="input-group">
        <label>选择物品</label>
        <div class="custom-select" id="itemSelectWrapper">
          <div class="select-display" id="selectDisplay">
            -- 请先加载物品列表 --
          </div>
          <div class="select-dropdown" id="selectDropdown">
            <input
              type="text"
              class="select-search"
              id="selectSearch"
              placeholder="搜索物品名称或ID..."
            />
            <div class="select-options" id="selectOptions"></div>
          </div>
        </div>
        <input type="hidden" id="selectedItemId" />
        <input type="hidden" id="selectedItemName" />
        <button id="loadItemsBtn" style="margin-top: 10px">加载物品列表</button>
      </div>
      <div class="input-group">
        <label>出售来源</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="includeBazaar" checked />
            Bazaar（1221 / 1226 legacy）
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="includeMarket" checked />
            Item Market（1113 / 1104 old）
          </label>
        </div>
      </div>
      <div class="time-group">
        <div class="input-group">
          <label for="startTime">开始时间</label>
          <input type="datetime-local" id="startTime" />
        </div>
        <div class="input-group">
          <label for="endTime">结束时间</label>
          <input type="datetime-local" id="endTime" />
        </div>
      </div>
      <button id="queryBtn">查询出售记录</button>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="info" id="infoMsg"></div>
    <div class="result-section" id="resultSection">
      <div class="summary">
        <h3>出售统计</h3>
        <div class="summary-row">
          <span class="label">物品名称</span
          ><span class="value" id="summaryItemName">-</span>
        </div>

          <span class="label">实际收入</span
          ><span class="value" id="summaryTotalRevenue">$0</span>
        </div>

          <span class="label">出售均价（税后）</span

          <span class="label">Market 税费</span

        </div>

          <span class="label">Bazaar出售</span
          ><span class="value" id="summaryBazaar">0 件</span>
        </div>

          <span class="label">Item Market出售</span
          ><span class="value" id="summaryMarket">0 件</span>
        </div>

      <div id="sellList"></div>
    </div>

</div>

<script>
  (function () {
    const storageKey = "sell-price-tool-direct-load";
    const isDirectLoad = !sessionStorage.getItem(storageKey);
    if (!isDirectLoad) {
      sessionStorage.removeItem(storageKey);
      window.location.reload();
      return;
    }
    sessionStorage.setItem(storageKey, "true");
    window.addEventListener("beforeunload", function () {
      sessionStorage.removeItem(storageKey);
    });
  })();

  var SELL_LOG_TYPES = {
    bazaar: { ids: [1221, 1226], label: "Bazaar" },
    market: { ids: [1113, 1104], label: "Item Market" },
  };
  var API_DELAY_MS = 1000;
  var RATE_LIMIT_RETRIES = 5;

  function sleep(ms) {
    return new Promise(function (r) {
      setTimeout(r, ms);
    });
  }

  function isRateLimitError(data) {
    if (!data || !data.error) return false;
    var code = data.error.code;
    var msg = (data.error.error || "").toLowerCase();
    return code === 5 || msg.indexOf("too many") !== -1;
  }

  var apiKeyInput = document.getElementById("apiKey");
  var selectDisplay = document.getElementById("selectDisplay");
  var selectDropdown = document.getElementById("selectDropdown");
  var selectSearch = document.getElementById("selectSearch");
  var selectOptions = document.getElementById("selectOptions");
  var selectedItemId = document.getElementById("selectedItemId");
  var selectedItemName = document.getElementById("selectedItemName");
  var loadItemsBtn = document.getElementById("loadItemsBtn");
  var includeBazaarCheckbox = document.getElementById("includeBazaar");
  var includeMarketCheckbox = document.getElementById("includeMarket");
  var startTimeInput = document.getElementById("startTime");
  var endTimeInput = document.getElementById("endTime");
  var queryBtn = document.getElementById("queryBtn");
  var errorMsg = document.getElementById("errorMsg");
  var infoMsg = document.getElementById("infoMsg");
  var resultSection = document.getElementById("resultSection");
  var sellList = document.getElementById("sellList");

  var itemsCache = [];

  function convertToTimestamp(dateStr) {
    if (!dateStr) return null;
    return Math.floor(new Date(dateStr).getTime() / 1000);
  }

  function formatMoney(amount) {
    return "$" + amount.toLocaleString();
  }

  function formatTime(timestamp) {
    return new Date(timestamp * 1000).toLocaleString("zh-CN");
  }

  function getLogTypeName(logId) {
    if (logId === 1221) return "Bazaar";
    if (logId === 1226) return "Bazaar (legacy)";
    if (logId === 1113) return "Item Market";
    if (logId === 1104) return "Item Market (old)";
    return "Unknown";
  }

  function getSellCategory(logId) {
    if (logId === 1221 || logId === 1226) return "bazaar";
    if (logId === 1113 || logId === 1104) return "market";
    return null;
  }

  function getSelectedLogTypes() {
    var types = [];
    if (includeBazaarCheckbox.checked)
      types = types.concat(SELL_LOG_TYPES.bazaar.ids);
    if (includeMarketCheckbox.checked)
      types = types.concat(SELL_LOG_TYPES.market.ids);
    return types;
  }

  async function fetchItems(apiKey) {
    var response = await fetch(
      "https://api.torn.com/v2/torn/items?key=" + apiKey,
      {
        method: "GET",
        headers: { accept: "application/json" },
      }
    );
    if (!response.ok) throw new Error("获取物品列表失败：" + response.status);
    var data = await response.json();
    if (data.error) throw new Error(data.error.error || "API返回错误");
    return data.items || [];
  }

  function renderOptions(items) {
    selectOptions.innerHTML = "";
    items.forEach(function (item) {
      var div = document.createElement("div");
      div.className = "select-option";
      div.textContent = item.name + " (ID: " + item.id + ")";
      div.dataset.id = item.id;
      div.dataset.name = item.name;
      div.addEventListener("click", function () {
        selectedItemId.value = item.id;
        selectedItemName.value = item.name;
        selectDisplay.textContent = item.name + " (ID: " + item.id + ")";
        selectDropdown.classList.remove("show");
      });
      selectOptions.appendChild(div);
    });
  }

  selectDisplay.addEventListener("click", function (e) {
    e.stopPropagation();
    if (itemsCache.length === 0) return;
    selectDropdown.classList.toggle("show");
    if (selectDropdown.classList.contains("show")) {
      selectSearch.value = "";
      renderOptions(itemsCache);
      selectSearch.focus();
    }
  });

  selectSearch.addEventListener("input", function () {
    var searchText = selectSearch.value.toLowerCase();
    var filtered = itemsCache.filter(function (item) {
      return (
        item.name.toLowerCase().includes(searchText) ||
        item.id.toString().includes(searchText)
      );
    });
    renderOptions(filtered);
  });

  selectSearch.addEventListener("click", function (e) {
    e.stopPropagation();
  });

  document.addEventListener("click", function () {
    selectDropdown.classList.remove("show");
  });

  loadItemsBtn.addEventListener("click", async function () {
    var apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      errorMsg.textContent = "请先输入API Key";
      return;
    }

    loadItemsBtn.disabled = true;
    loadItemsBtn.textContent = "加载中...";
    errorMsg.textContent = "";

    try {
      infoMsg.textContent = "正在加载物品列表...";
      itemsCache = await fetchItems(apiKey);
      selectDisplay.textContent =
        "-- 请选择物品 (" + itemsCache.length + "个) --";
      infoMsg.textContent = "已加载 " + itemsCache.length + " 个物品";
      loadItemsBtn.textContent = "重新加载";
    } catch (err) {
      errorMsg.textContent = err.message;
    } finally {
      loadItemsBtn.disabled = false;
    }
  });
</script>

<script>
  async function fetchLogsPage(apiKey, logTypes, from, to, onWait) {
    var attempt = 0;
    while (true) {
      var response = await fetch(
        "https://api.torn.com/user/?selections=log&key=" +
          apiKey +
          "&log=" +
          logTypes +
          "&from=" +
          from +
          "&to=" +
          to,
        {
          method: "GET",
          headers: { accept: "application/json" },
        }
      );
      if (!response.ok) throw new Error("API请求失败：" + response.status);
      var data = await response.json();
      if (isRateLimitError(data)) {
        attempt++;
        if (attempt > RATE_LIMIT_RETRIES) throw new Error(data.error.error);
        var waitMs = 5000 * attempt;
        if (onWait) onWait(waitMs, attempt);
        await sleep(waitMs);
        continue;
      }
      if (data.error) throw new Error(data.error.error || "API返回错误");
      return data.log || {};
    }
  }

  async function fetchAllLogs(apiKey, logTypes, from, to, onProgress) {
    var limit = 100;
    var allLogs = {};
    var hasMore = true;
    var pageCount = 0;
    var maxPages = 1000;
    var currentTo = to;

    while (hasMore && pageCount < maxPages) {
      pageCount++;
      if (onProgress) onProgress(pageCount);
      var logs = await fetchLogsPage(apiKey, logTypes, from, currentTo, function (waitMs, attempt) {
        if (onProgress) onProgress(pageCount, waitMs, attempt);
      });
      var logEntries = Object.entries(logs);

      if (logEntries.length > 0) {
        Object.assign(allLogs, logs);
        if (logEntries.length < limit) {
          hasMore = false;
        } else {
          var minTimestamp = Infinity;
          logEntries.forEach(function (entry) {
            if (entry[1].timestamp < minTimestamp)
              minTimestamp = entry[1].timestamp;
          });
          var newTo = minTimestamp - 1;
          if (newTo <= from) hasMore = false;
          else currentTo = newTo;
        }
      } else {
        hasMore = false;
      }
      if (hasMore) await sleep(API_DELAY_MS);
    }
    return allLogs;
  }

  function calcSellAmounts(log, item, category) {
    var grossEach = log.data.cost_each || 0;
    var grossTotal = grossEach * item.qty;
    var totalItemsQty = (log.data.items || []).reduce(function (s, i) {
      return s + i.qty;
    }, 0);
    var share = totalItemsQty > 0 ? item.qty / totalItemsQty : 1;

    if (category !== "market") {
      var bazaarTotal =
        log.data.cost_total != null
          ? Math.round(log.data.cost_total * share)
          : grossTotal;
      var bazaarEach = item.qty > 0 ? Math.round(bazaarTotal / item.qty) : 0;
      return {
        grossEach: bazaarEach,
        grossTotal: bazaarTotal,
        fee: 0,
        netEach: bazaarEach,
        netTotal: bazaarTotal,
      };
    }

    var fee = Math.round((log.data.fee || 0) * share);
    var netTotal =
      log.data.cost_total != null
        ? Math.round(log.data.cost_total * share)
        : grossTotal - fee;
    var netEach = item.qty > 0 ? Math.round(netTotal / item.qty) : 0;
    return {
      grossEach: grossEach,
      grossTotal: grossTotal,
      fee: fee,
      netEach: netEach,
      netTotal: netTotal,
    };
  }

  function processSellLogs(logs, targetItemId, allowedLogIds) {
    var sells = [];
    var allowedSet = {};
    allowedLogIds.forEach(function (id) {
      allowedSet[id] = true;
    });

    Object.entries(logs).forEach(function (entry) {
      var logId = entry[0],
        log = entry[1];
      if (!allowedSet[log.log]) return;

      var category = getSellCategory(log.log);
      if (!category) return;

      (log.data.items || []).forEach(function (item) {
        if (item.id !== targetItemId) return;

        var amounts = calcSellAmounts(log, item, category);
        sells.push({
          id: logId,
          type: category,
          typeName: getLogTypeName(log.log),
          timestamp: log.timestamp,
          qty: item.qty,
          grossEach: amounts.grossEach,
          grossTotal: amounts.grossTotal,
          fee: amounts.fee,
          priceEach: amounts.netEach,
          revenueTotal: amounts.netTotal,
          buyer: log.data.buyer || log.data.seller || null,
        });
      });
    });
    return sells;
  }

  function renderResults(sells, itemName) {
    var totalQty = sells.reduce(function (s, p) {
      return s + p.qty;
    }, 0);
    var totalRevenue = sells.reduce(function (s, p) {
      return s + p.revenueTotal;
    }, 0);
    var totalFee = sells.reduce(function (s, p) {
      return s + p.fee;
    }, 0);
    var avgPrice = totalQty > 0 ? Math.round(totalRevenue / totalQty) : 0;

    var bazaarQty = sells
      .filter(function (p) {
        return p.type === "bazaar";
      })
      .reduce(function (s, p) {
        return s + p.qty;
      }, 0);
    var marketQty = sells
      .filter(function (p) {
        return p.type === "market";
      })
      .reduce(function (s, p) {
        return s + p.qty;
      }, 0);

    document.getElementById("summaryItemName").textContent = itemName;
    document.getElementById("summaryTotalQty").textContent =
      totalQty.toLocaleString();
    document.getElementById("summaryTotalRevenue").textContent =
      formatMoney(totalRevenue);
    document.getElementById("summaryAvgPrice").textContent =
      formatMoney(avgPrice);
    document.getElementById("summaryFee").textContent = formatMoney(totalFee);
    document.getElementById("summaryBazaar").textContent =
      bazaarQty.toLocaleString() + " 件";
    document.getElementById("summaryMarket").textContent =
      marketQty.toLocaleString() + " 件";

    sellList.innerHTML = "";
    sells.sort(function (a, b) {
      return b.timestamp - a.timestamp;
    });
    sells.forEach(function (p) {
      var div = document.createElement("div");
      div.className = "sell-item type-" + p.type;
      var priceInfo =
        p.type === "market"
          ? "<p>挂牌：" +
            formatMoney(p.grossEach) +
            " × " +
            p.qty +
            " = " +
            formatMoney(p.grossTotal) +
            "</p><p>税费：" +
            formatMoney(p.fee) +
            " | 实际：" +
            formatMoney(p.revenueTotal) +
            "（均价 " +
            formatMoney(p.priceEach) +
            "）</p>"
          : "<p>数量：" +
            p.qty +
            "</p><p>单价：" +
            formatMoney(p.priceEach) +
            "</p><p>总价：" +
            formatMoney(p.revenueTotal) +
            "</p>";
      div.innerHTML =
        "<h4>" +
        p.typeName +
        " - " +
        formatTime(p.timestamp) +
        '</h4><div class="sell-info">' +
        priceInfo +
        "<p>买家ID：" +
        (p.buyer || "匿名") +
        "</p></div>";
      sellList.appendChild(div);
    });
  }

  queryBtn.addEventListener("click", async function () {
    errorMsg.textContent = "";
    infoMsg.textContent = "";
    resultSection.style.display = "none";

    var apiKey = apiKeyInput.value.trim();
    var itemId = parseInt(selectedItemId.value);
    var itemName = selectedItemName.value;
    var startDateStr = startTimeInput.value;
    var endDateStr = endTimeInput.value;
    var selectedLogIds = getSelectedLogTypes();

    if (!apiKey) {
      errorMsg.textContent = "请输入API Key！";
      return;
    }
    if (!itemId) {
      errorMsg.textContent = "请选择物品！";
      return;
    }
    if (selectedLogIds.length === 0) {
      errorMsg.textContent = "请至少勾选一个出售来源！";
      return;
    }
    if (!startDateStr || !endDateStr) {
      errorMsg.textContent = "请选择完整的时间范围！";
      return;
    }

    var startTimestamp = convertToTimestamp(startDateStr);
    var endTimestamp = convertToTimestamp(endDateStr);
    if (startTimestamp >= endTimestamp) {
      errorMsg.textContent = "开始时间不能晚于结束时间！";
      return;
    }

    queryBtn.disabled = true;
    queryBtn.textContent = "查询中...";

    try {
      infoMsg.textContent = "正在获取出售记录...";
      var sellLogs = await fetchAllLogs(
        apiKey,
        selectedLogIds.join(","),
        startTimestamp,
        endTimestamp,
        function (page, waitMs, attempt) {
          if (waitMs) {
            infoMsg.textContent =
              "请求过快，等待 " +
              Math.round(waitMs / 1000) +
              " 秒后重试（" +
              attempt +
              "/" +
              RATE_LIMIT_RETRIES +
              "）...";
          } else {
            infoMsg.textContent = "正在获取出售记录（第 " + page + " 页）...";
          }
        }
      );
      var sells = processSellLogs(sellLogs, itemId, selectedLogIds);

      if (sells.length === 0) {
        errorMsg.textContent = "未找到该物品的出售记录";
        infoMsg.textContent = "";
      } else {
        infoMsg.textContent = "";
        resultSection.style.display = "block";
        renderResults(sells, itemName);
      }
    } catch (err) {
      errorMsg.textContent = "错误：" + err.message;
    } finally {
      queryBtn.disabled = false;
      queryBtn.textContent = "查询出售记录";
    }
  });
</script>
